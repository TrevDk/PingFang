name: Build PFPS knowledge video

on:
  push:
    branches:
      - pfps-wechat-video-final-20260717
    paths:
      - "video-source/**"
      - ".github/workflows/build-pfps-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pfps-wechat-video-final-20260717
      - name: Install video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk
          python -m pip install --upgrade pillow
      - name: Generate narrated MP4
        run: python video-source/generate_video.py
      - name: Validate video
        run: |
          test -s site/p.mp4
          ffprobe -v error -show_entries format=duration,size -of json site/p.mp4
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/p.mp4 site/poster.jpg site/video_metadata.json
          git commit -m "Generate PFPS knowledge video" || exit 0
          git push origin HEAD:pfps-wechat-video-final-20260717
